---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </div>

  <div class="post-content">
    {{ content }}
  </div>

  <hr>
  <p><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
