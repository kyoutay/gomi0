---
layout: default
---
<p>{{ site.description }}</p>

<h2>Entries</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% else %}
    <li>No posts yet.</li>
  {% endfor %}
</ul>
